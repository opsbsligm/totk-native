include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      allow_failure: false
      max_scan_depth: -1
      pipcompile_lockfile_file_name_pattern: "requirements-build.lock"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [test]
variables:
  AST_ENABLE_MR_PIPELINES: "true"
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  GITLAB_ADVANCED_SAST_CPP_ENABLED: "true"
default:
  tags: [安全扫描]
  timeout: 40 minutes

native-unit:
  needs: []
  tags: [gitlab--duo]
  image: local.gitlab-ci.invalid/gitlab-org/duo-workflow/default-docker-image/workflow-generic-image:v0.0.23
  script:
    - python3 tools/check_source.py
    - mkdir -p out/public-tests
    - cd out/public-tests
    - python3 -B -m unittest discover -s "$CI_PROJECT_DIR/tests" -v

native-build:
  needs: []
  tags: [native-games]
  image: native-games/toolchain:e40e026f8befe2010687
  script:
    - mkdir -p out/home
    - export HOME="$CI_PROJECT_DIR/out/home"
    - python3 tools/check_toolchain.py
    - export NATIVE_SOURCE_CHECK="/tmp/native-source-${CI_JOB_ID}"
    - mkdir -p "$NATIVE_SOURCE_CHECK/source"
    - trap 'rm -rf "$NATIVE_SOURCE_CHECK"' EXIT
    - python3 tools/export_source.py --output "$NATIVE_SOURCE_CHECK/source.tar.gz"
    - tar -xzf "$NATIVE_SOURCE_CHECK/source.tar.gz" -C "$NATIVE_SOURCE_CHECK/source"
    - python3 "$NATIVE_SOURCE_CHECK/source/tools/check_source.py"
    - python3 "$NATIVE_SOURCE_CHECK/source/tools/pipeline.py" runtime --work "$CI_PROJECT_DIR/out/public" --jobs 2
    - mkdir -p out/compiler-policy
    - cd out/compiler-policy && python3 ../../tools/test_compile_policy.py && cd ../..
    - python3 tools/audit_linux_runtime.py --build out/public/runtime --evidence out/public/link-audit
  artifacts:
    when: always
    expire_in: 7 days
    paths: [out/public/logs/, out/public/link-audit/]

container_scanning:
  image: registry.gitlab.com/security-products/container-scanning@sha256:f86aa7593f200e76a7fae6fb9a65d1fafefa009060d47d93fba7490de9e79528
  allow_failure: false
  needs: []
  variables:
    GIT_STRATEGY: fetch
    CS_native-games/toolchain:e40e026f8befe2010687: "archive://out/toolchain.tar.gz"
    CS_DISABLE_LANGUAGE_VULNERABILITY_SCAN: "false"
  before_script:
    - ruby .gitlab/fetch_toolchain.rb

dependency-scanning:
  image: registry.gitlab.com/security-products/dependency-scanning@sha256:50ecac454e31b3177c9119b85141592b57c2ee3835e051d77ac72c0c5a77980f

semgrep-sast:
  image: registry.gitlab.com/security-products/semgrep@sha256:6438917354ac62eebd1a85ba7dcd6d597f1bf4613ec6ea9eb61892cf4c3b4732
  allow_failure: false

gitlab-advanced-sast:
  image: registry.gitlab.com/security-products/gitlab-advanced-sast@sha256:8208104eda122edace1e61a11e182260ab8db2c77ed72da53501300f8ed51166
  allow_failure: false

gitlab-advanced-sast-cpp:
  image: registry.gitlab.com/security-products/clangsa@sha256:9aff93a28ad09aaffd1701747e350d643ce31e3f6f8a561541e6d95021fb32f3
  allow_failure: false

gitlab-advanced-sast-ext:
  image: registry.gitlab.com/security-products/gitlab-advanced-sast-ext@sha256:b8f0507aab668350963bc9ded1d615c97db46a47fe336c0c6ec9cb69cee63f1f
  allow_failure: false

secret_detection:
  image: registry.gitlab.com/security-products/secrets@sha256:dd2449c8bf1fdb25c7e81b7128c9ada36e0b4f10c8763bd71c3a2ca8cda9e51a
  allow_failure: false
